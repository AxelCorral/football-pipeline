version: 2

sources:
  - name: football_curated
    description: >
      Curated zone of the S3 data lake, catalogued in AWS Glue and queried
      through Athena. One Parquet file per competition and season, written by
      the Python ingestion (`src/transform/process_matches.py`). This is the
      boundary between Python and dbt: everything upstream is API calls and
      raw-to-Parquet normalisation, everything downstream is SQL.
    database: "{{ env_var('DBT_ATHENA_CATALOG', 'awsdatacatalog') }}"
    schema: "{{ env_var('ATHENA_DATABASE', 'football_db') }}"

    # No freshness block on purpose: the curated Parquet carries no ingestion
    # timestamp, only `date` (kick-off time). Running freshness against a
    # kick-off column would measure the fixture calendar, not data recency, and
    # would go stale every summer break. Adding an `ingested_at` column to the
    # Python transform is the prerequisite, and is tracked in docs/dbt.md.

    tables:
      - name: matches
        description: >
          One row per match as normalised by the Python pipeline — but not
          necessarily one row per *match*: replaying the ingestion over the same
          raw partitions appends duplicates, which `stg_matches` removes.
        meta:
          # Read by dbt-duckdb only (dev / dev_s3 targets); dbt-athena ignores
          # it and resolves the Glue table above. Same columns either way: the
          # local snapshot and the S3 curated files are written by the same
          # Python transform. The path is relative to the repository root —
          # dbt does not chdir into --project-dir. Override with
          # DBT_SOURCE_MATCHES to point at the curated zone on S3.
          external_location: >-
            read_parquet('{{ env_var("DBT_SOURCE_MATCHES", "data/cache/matches_all_*.parquet") }}',
            union_by_name = true)
        columns:
          - name: match_id
            description: football-data.org match identifier. Not unique in this table (see above).
            data_tests:
              - not_null
          - name: date
            description: Kick-off timestamp, UTC.
            data_tests:
              - not_null
          - name: competition_code
            description: "Short competition code: PL, FL1, BL1, SA, PD."
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["PL", "FL1", "BL1", "SA", "PD"]
          - name: competition
            description: Competition display name.
          - name: season
            description: Season start year (2025 means the 2025/26 season).
            data_tests:
              - not_null
          - name: home_team
            description: Home team name, as returned by the API.
            data_tests:
              - not_null
          - name: away_team
            description: Away team name, as returned by the API.
            data_tests:
              - not_null
          - name: home_goals
            description: Full-time home goals; NULL when the match has no score yet.
          - name: away_goals
            description: Full-time away goals; NULL when the match has no score yet.
          - name: total_goals
            description: home_goals + away_goals, NULL when either is missing.
          - name: result
            description: "H / D / A, NULL when the match has no score yet."
          - name: status
            description: "football-data.org status: FINISHED, AWARDED, SCHEDULED, POSTPONED…"
            data_tests:
              - not_null
          - name: referee
            description: Main referee; missing for part of the fixtures.
